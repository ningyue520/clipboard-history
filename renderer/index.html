<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' img: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>历史粘贴板</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="win-enter">
  <!-- 顶部：可拖拽的标题栏 + 搜索 -->
  <header class="titlebar">
    <div class="search">
      <span class="search-icon">⌕</span>
      <input id="search" type="text" placeholder="搜索历史记录..." autocomplete="off" spellcheck="false" />
      <span id="clear-search" class="clear-search" hidden>&times;</span>
    </div>
    <button id="minimize-btn" class="icon-btn" title="最小化">&#8212;</button>
    <button id="settings-btn" class="icon-btn" title="设置">⚙</button>
    <button id="close-btn" class="icon-btn" title="关闭">✕</button>
  </header>

  <!-- 标签页 -->
  <nav class="tabs">
    <button class="tab on" data-tab="active">全部</button>
    <button class="tab" data-tab="favorite">收藏</button>
    <button class="tab" data-tab="expired">已过期<span id="expired-badge" class="badge" hidden>0</span></button>
  </nav>

  <!-- 卡片列表 -->
  <main id="list"></main>

  <!-- 空状态 -->
  <div id="empty" class="empty" hidden>
    <div class="empty-icon">📋</div>
    <p id="empty-text">还没有记录，复制点什么试试吧</p>
    <p class="empty-sub">复制文字或截图后，会自动出现在这里</p>
  </div>

  <!-- 设置面板 -->
  <div id="settings-overlay" class="overlay" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2>设置</h2>
        <button id="settings-close" class="icon-btn">✕</button>
      </div>
      <div class="row">
        <div class="row-label">保留期限</div>
        <div class="seg" id="seg-retention">
          <button data-days="1">1 天</button>
          <button data-days="3" class="on">3 天</button>
          <button data-days="5">5 天</button>
        </div>
        <div class="row-hint">超过期限的内容会移到“已过期”区，置顶内容永不过期</div>
      </div>
      <div class="row">
        <label class="check">
          <input id="autolaunch" type="checkbox" />
          <span>开机自动启动（常驻后台记录）</span>
        </label>
      </div>
      <div class="row">
        <div class="row-label">关闭窗口时</div>
        <div class="seg" id="seg-close">
          <button data-close="exit">直接退出程序</button>
          <button data-close="tray">最小化到托盘</button>
        </div>
        <div class="row-hint">选择“最小化到托盘”后，关闭窗口会继续在后台记录</div>
      </div>
      <div class="row">
        <div class="row-label">呼出快捷键</div>
        <input id="shortcut" class="retention-select" type="text" readonly placeholder="点击后按下新快捷键" title="点击输入框后按下新的组合键" />
        <div class="row-hint">点击输入框后按下新组合键，例如 Ctrl + Alt + H</div>
      </div>
      <div class="row">
        <div class="row-label">已过期内容 <span id="expired-count" class="muted"></span></div>
        <button id="clear-expired" class="danger-btn">立即清空</button>
        <div class="row-hint">清空后无法恢复</div>
      </div>
      <div class="panel-foot">
        历史粘贴板 v1.0 · 数据只保存在本机
      </div>
    </div>
  </div>

  <!-- 操作提示气泡 -->
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
