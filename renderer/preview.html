<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' img: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>图片预览</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #101012;
      overflow: hidden;
      cursor: zoom-out;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      width: 96vw;
      height: 94vh;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      animation: preview-enter 0.2s ease backwards;
      transition: transform 0.15s ease;
      transform-origin: center center;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
    }

    body.zoomed img {
      cursor: grab;
    }

    img.dragging {
      transition: none;
      cursor: grabbing;
    }

    @keyframes preview-enter {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <img id="preview-img" alt="图片预览" />
  <script src="preview.js"></script>
</body>
</html>
